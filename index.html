<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot Manual de Crédito</title>
    <!-- Librería PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Encabezado Estilo Tarjeta Oscura */
        .app-header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            padding: 18px 16px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .app-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .app-header p {
            font-size: 12px;
            opacity: 0.85;
        }

        /* Tarjeta de Estado del Documento */
        .card-status {
            background: var(--card-bg);
            margin: 12px 16px;
            padding: 10px 16px;
            padding: 0 16px 80px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-message {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 14px;
            max-width: 92%;
            line-height: 1.5;
            font-size: 13.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-message.bot {
            align-self: flex-start;
            border-left: 4px solid var(--primary);
        }

        .card-message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border: none;
        }

        /* Tarjeta estructurada dentro de la respuesta del bot */
        .response-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 8px;
            font-size: 13px;
            color: #475569;
        }

        /* Área de Input con Barra Inferior de Navegación */
        /* Barra de Navegación Inferior */
            <strong>¡Hola!</strong> Pregúntame sobre los requisitos del manual (por ejemplo: <em>"¿Puedo tener 3 personas rentadas en un grupo de 5?"</em>) y te daré una respuesta clara y directa.
        </div>
    </div>

    <!-- Contenedor inferior -->
    <div class="input-footer-container">
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." disabled>
            <button id="sendBtn" onclick="enviarMensaje()" disabled>Enviar</button>
        </div>

        <!-- Barra de navegación inferior -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                Chat
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Temas
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                Simulador
            </a>
        </div>
    </div>
</div>

<script>
    let textoCompletoPDF = "";

    window.addEventListener('DOMContentLoaded', async () => {
        const rutaAutomatica = 'chat.pdf';
        try {
            const respuesta = await fetch(rutaAutomatica);
            if (respuesta.ok) {
                const blob = await respuesta.blob();
                procesarArchivoPDF(blob);
            } else {
                document.getElementById('statusText').textContent = "Selecciona tu PDF abajo ↓";
            }
        } catch (e) {
            document.getElementById('statusText').textContent = "Sube tu PDF para iniciar.";
        }
    });

    document.getElementById('pdfFile').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file) {
            procesarArchivoPDF(file);
        }
    });

    async function procesarArchivoPDF(source) {
        const statusText = document.getElementById('statusText');
        statusText.textContent = "Procesando documento...";

        try {
            const arrayBuffer = await (source instanceof Blob ? source.arrayBuffer() : source);
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdfDoc = await loadingTask.promise;
            
            let textoAcumulado = "";
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const textContent = await page.getTextContent();
                const textItems = textContent.items.map(item => item.str);
                textoAcumulado += textItems.join(" ") + "\n";
            }

            textoCompletoPDF = textoAcumulado;
            statusText.textContent = `✓ Documento listo (${pdfDoc.numPages} págs)`;
            
            document.getElementById('userInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            agregarMensajeBot(`¡Manual cargado correctamente! Ya puedes hacerme preguntas específicas sobre los lineamientos.`);
        } catch (error) {
            console.error(error);
            statusText.textContent = "Error al leer el PDF.";
            agregarMensajeBot("⚠️ Hubo un problema al procesar el archivo PDF.");
        }
    }

    function enviarMensaje() {
        const input = document.getElementById('userInput');
        const pregunta = input.value.trim();
        if (!pregunta) return;

        agregarMensajeUsuario(pregunta);
        input.value = "";

        setTimeout(() => {
            const respuesta = generarRespuestaInteligente(pregunta, textoCompletoPDF);
            agregarMensajeBot(respuesta);
        }, 300);
    }

    function agregarMensajeUsuario(texto) {
        const chatMessages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'card-message user';
        div.textContent = texto;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function agregarMensajeBot(htmlContent) {
        const chatMessages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'card-message bot';
        div.innerHTML = htmlContent;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Lógica para estructurar respuestas claras y directas tipo asistente
    function generarRespuestaInteligente(pregunta, texto) {
        if (!texto) return "Primero debes cargar el documento PDF.";

        const pLower = pregunta.toLowerCase();

        // Detectar si pregunta sobre personas rentadas / casa rentada en grupos
        if (pLower.includes("renta") || pLower.includes("rentadas") || pLower.includes("casa rentada") || pLower.includes("prestada")) {
            return `
                <strong>No, no se puede.</strong><br><br>
                La política del manual indica que en grupos nuevos <strong>se aceptarán máximo dos (2) personas con casa rentada o prestada por cada cinco integrantes</strong>.<br>
                <div class="response-card">
                    📌 <strong>Fundamento del manual:</strong> "En grupos nuevos se aceptarán dos por cada cinco integrantes" que vivan en casa rentada o prestada (equivalente al 40%). Tener 3 excede el límite permitido.
                </div>
            `;
        }

        // Búsqueda general mejorada si no es sobre rentas
        const parrafos = texto.split(/\r?\n/);
        const palabrasClave = pLower.replace(/[¿?]/g, "").split(" ").filter(p => p.length > 3);
        let mejorParrafo = "";

        for (let parrafo of parrafos) {
            let parrafoLower = parrafo.toLowerCase();
            let aciertos = 0;
            for (let palabra of palabrasClave) {
                if (parrafoLower.includes(palabra)) aciertos++;
            }
            if (aciertos > 0 && parrafo.trim().length > 30) {
                mejorParrafo = parrafo.trim();
                break;
            }
        }

        if (mejorParrafo) {
            return `
                <strong>Resultado de tu consulta:</strong><br><br>
                ${mejorParrafo}
            `;
        } else {
            return "No encontré una regla específica para esa consulta en el manual. Prueba reformulando tu pregunta.";
        }
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            enviarMensaje();
        }
    });
</script>

</body>
</html>
